name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Validate release commit
        run: nix develop --command just ci

      - name: Ensure generated files are committed
        shell: bash
        run: |
          if ! git diff --exit-code || [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            echo "Release validation changed the working tree."
            exit 1
          fi

  release:
    name: GoReleaser
    needs:
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Publish GitHub release
        run: nix develop --command just release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
